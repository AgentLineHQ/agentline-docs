name: Docs

# Quality gates for the Mintlify docs + keep the OpenAPI spec in sync with the
# SDK source-of-truth repo (AgentLineHQ/agentline-sdks).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily spec refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs (mint validate + broken links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Validate docs.json + OpenAPI
        run: mint validate

      - name: Broken-link check
        run: mint broken-links

  sync-spec:
    name: Sync OpenAPI from agentline-sdks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Pull curated spec
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/AgentLineHQ/agentline-sdks/main/fern/openapi/openapi.json \
            -o openapi.json
          echo "Spec fetched: $(jq '.paths | length') paths"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if git diff --cached --quiet; then
            echo "Spec unchanged."
          else
            git commit -m "chore: sync OpenAPI from agentline-sdks"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
